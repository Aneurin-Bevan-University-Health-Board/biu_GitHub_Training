# SINGLE SOURCE OF TRUTH for the GitHub training deck.
#
#   Edit this file, then run:   python Training/slides/build_deck.py
#
# That one command:
#   1. rebuilds Training/GitHub_Training_Day.pptx
#   2. rewrites the generated "Slide Deck Content" block at the end of every session markdown file
#   3. rewrites the session tables in README.md and Training/README.md
#
# CI runs `python Training/slides/build_deck.py --check`, which fails if the deck, the markdown or the
# session tables have drifted from this file.  Do not hand-edit the generated blocks.
#
# Slide fields:  title | sections: [{heading, bullets}] | note (small grey line) | callout (bold navy line)

deck:
  title: GitHub for Analytics and Data Teams
  subtitle: One-Day Training | ABUHB Business Intelligence
  closing_title: Thank You
  closing_subtitle: Questions? Raise a GitHub issue or contact the GitHub admin team.
  breaks:
  - {after_session: 4, label: Lunch, time: "11:30 - 12:15"}
  agenda_footer: All hands-on work uses the training repository and synthetic data only. Never use real patient data in GitHub or Codespaces.

sessions:
# ---------------------------------------------------------------------------------------------------
- number: 1
  title: Why GitHub for Data Teams
  duration: 30 minutes
  time: "09:00 - 09:30"
  file: Training/01_Session_1_Why_GitHub_for_Data_Teams.md
  focus: Strategic benefits and core concepts
  your_area:
    heading: "Find your area and open your workspace"
    minutes: 5
    steps:
    - "Sign in to GitHub with your ABUHB account and open the training repository"
    - "Open the participants folder and find your folder, named firstname-lastname"
    - "On the repository page choose Code, Codespaces, Create codespace on main: this is your workspace for the whole day"
    - "Check that the terminal and editor open"
    checkpoint: "A running Codespace, and you know where your folder is: participants/<your-folder>"
    image: repo_area.png
    image_position: right
    image_alt: "Diagram of a participant area folder inside the shared training repository"
  slides:
  - title: What is GitHub?
    sections:
    - heading: Git — the engine
      bullets:
      - Version control system that tracks changes to files over time
      - Distributed — every user has a complete copy of the project history
      - Branching — separate lines of development for different pieces of work
    - heading: GitHub — the platform
      bullets:
      - Web interface for working with Git repositories
      - Collaboration tools — issues, pull requests and project boards
      - Secure cloud hosting, with permissions and access control
    note: Git is the engine. GitHub is the platform built around it.
  - title: "GitHub Enterprise Cloud: What We Use (Not GitHub Free)"
    sections:
    - heading: ABUHB uses GitHub Enterprise Cloud
      bullets:
      - Our organisation is a paid Enterprise Cloud account, not a personal GitHub Free account
      - You sign in with your ABUHB identity and access is controlled through the organisation
      - Admins set the policies for repositories, Codespaces, Copilot and security
    - heading: What the paid plan gives us that Free does not
      bullets:
      - Enforced branch protection and required reviews on private repositories
      - Organisation-wide access control, single sign-on and an audit log
      - Copilot Business licences and organisation controls for Codespaces
      - Advanced Security products for private repositories (covered in Session 7)
    callout: Do your NHS work only in the ABUHB organisation. Never use a personal Free account for it.
  - title: "Before You Start: Your Setup Checklist"
    sections:
    - heading: You should already have
      bullets:
      - A GitHub account that is a member of the ABUHB organisation (Azure AD group ABB_BIU_GitHub_Users)
      - A browser that can open Codespaces (nothing else to install). GitHub Desktop and VS Code are optional
      - Signed in to GitHub, with single sign-on authorised for the organisation
      - "Optional: access to the ndr-hb-abuhb-academy Google Cloud project, for the SQL extension at the end of the day"
      - A GitHub personal access token, stored safely, if your trainer asks for one
    - heading: If something is missing
      bullets:
      - "Ask the GitHub admin team: ABB.BIU.GitHub.Admin@nhswales365.onmicrosoft.com"
      - Every new repository needs an approved HALO ticket
    note: Full step-by-step instructions are in Training/00_Setup_and_Access.md.
  - title: Creating a Personal Access Token (PAT)
    sections:
    - heading: A token is a password for one job
      bullets:
      - "Open GitHub, then Settings, Developer settings, Personal access tokens, Fine-grained tokens"
      - Choose Generate new token, name it, and pick the ABUHB organisation as resource owner
      - Set a short expiry and select only the repositories you need
      - "Give the least access: Contents and Pull requests read and write, Metadata read"
      - Copy the token once and save it in your credential manager or password manager
    callout: Never put a token in code, a notebook, an issue or a Copilot prompt. If one leaks, revoke it at once.
  - title: GitHub for Healthcare Analytics
    sections:
    - heading: Faster development
      bullets:
      - Remove technical barriers to collaborative work
      - Reuse shared code and resources instead of starting again
    - heading: Enhanced security
      bullets:
      - Share code securely, within approved protocols
      - Controlled access and an audit trail for compliance
    - heading: Improved insights
      bullets:
      - Efficient collaboration across teams and organisations
      - A change log for every modification, surfaced in pull requests
  - title: Why GitHub for Data Teams?
    sections:
    - heading: Collaboration and auditability
      bullets:
      - SQL, Python and notebooks live in repositories — not email or personal folders
      - Every change is tracked, reviewed and documented
      - Notebooks gain version history and reproducibility
    - heading: Single source of truth
      bullets:
      - One canonical repository per project or product
      - Protected main branch — only reviewed code reaches production
      - Tagged releases for specific versions (for example "Q1-2024-Report")
  - title: Rollback and Traceability
    sections:
    - heading: Rollback
      bullets:
      - A production problem? Revert to the last working version
      - No manual restoring from backups
    - heading: Traceability
      bullets:
      - Issue → Branch → Code → Tests → Pull Request → Review → Merge → Deploy → Issue closed
      - Supports regulatory audit, quality assurance and knowledge transfer
  - title: Setting Up Repositories for Success
    sections:
    - heading: Repository structure
      bullets:
      - README.md for project overview and setup
      - sql/ for extracts, transforms and reports
      - python/ for source code, notebooks and tests
      - docs/ for methodology, results and compliance
    - heading: Naming conventions
      bullets:
      - Branches — feature/new_api_onboarding, bugfix/measure_count, hotfix/urgent_data_sync
      - "Commit messages — a clear summary line, then detail, then \"Closes #123\""
  - title: Repository Governance
    sections:
    - heading: Why govern new repositories?
      bullets:
      - Consistent naming, and private by default
      - Confirms data classification and security requirements
      - Least-privilege access from day one
      - Links purpose → approval → configuration for audit
    - heading: A repository request covers
      bullets:
      - Name, purpose and maintainers
      - Data classification and visibility
      - Team access levels and compliance notes
    callout: No patient data in GitHub — ever.

  - title: How Access and New Repositories Work at ABUHB
    sections:
    - heading: Access
      bullets:
      - Access comes from the Azure AD group ABB_BIU_GitHub_Users
      - Questions go to the GitHub admin team
    - heading: New repositories
      bullets:
      - Raise a HALO ticket with the name, purpose, data classification and access list
      - The admin team creates the repository once the ticket is approved
# ---------------------------------------------------------------------------------------------------
- number: 2
  title: Introduction to GIT
  duration: 45 minutes
  time: "09:30 - 10:15"
  file: Training/02_Session_2_Introduction_to_GIT.md
  focus: GIT fundamentals and architecture
  your_area:
    heading: "Create your branch and fill in your README"
    minutes: 5
    steps:
    - "In your Codespace terminal, create your branch: git switch -c training/<your-folder>"
    - "Open participants/<your-folder>/README.md (already created for you) and fill it in"
    - "Stage and commit with the message: Fill in my area README"
    - "Run git status and git log to see what you made"
    checkpoint: "README.md filled in and committed on your own branch (local only for now)"
  slides:
  - title: GIT vs GitHub
    sections:
    - heading: GIT
      bullets:
      - A distributed version control system, created in 2005
      - Fast — most operations are local
      - Data integrity — everything is checksummed before storage
      - Free and open source
    - heading: GitHub
      bullets:
      - A cloud platform built on top of GIT
      - Adds pull requests, issues, projects, team management and Actions
    note: GIT is the engine that manages version control. GitHub adds collaboration.
  - title: How GIT Stores Your Work
    image: object_model.png
    image_position: right
    image_alt: "Diagram: a commit points to a tree, which points to blobs and sub-trees"
    sections:
    - heading: The object model
      bullets:
      - Blob — file content
      - Tree — directory structure
      - Commit — a snapshot with metadata
      - Tag — a named reference to a commit
    - heading: Snapshots and integrity
      bullets:
      - GIT stores snapshots of the whole project, not differences
      - Objects are addressed by a SHA-1 hash — any change gives a different hash
      - Nothing changes or corrupts undetected
  - title: The Three-Tree Architecture
    image: three_trees.png
    image_position: right
    image_alt: "Diagram: files move from working directory to staging area to repository"
    sections:
    - heading: Three places your files live
      bullets:
      - Working directory — where you edit files
      - Staging area (index) — what will go into the next commit
      - Repository (HEAD) — the committed history
    - heading: The three states of a file
      bullets:
      - Modified → Staged → Committed
    note: Staging lets you choose exactly which changes belong in each commit.
  - title: Commits, Branches and HEAD
    image: branch_merge.png
    image_position: right
    image_alt: "Diagram: two branches diverge from main and merge back"
    sections:
    - heading: Core concepts
      bullets:
      - Commit — the building block of history
      - Branch — a lightweight, movable pointer to a commit
      - Tag — a fixed pointer to a commit, used for releases
      - HEAD — your current position in the repository
    - heading: Basic operations
      bullets:
      - init, add, commit and log
      - Branching creates a new line of work; merging brings it back together
  - title: Why GIT's Design Matters for Data Teams
    sections:
    - heading: What you get
      bullets:
      - Data integrity — checksums protect history
      - Distributed reliability — every clone is a full backup
      - Speed — local operations
      - Safe experimentation — cheap branches
      - Complete history of every change
    callout: Everyone's laptop is a full copy of the project history.

# ---------------------------------------------------------------------------------------------------
- number: 3
  title: Branching and Sync Operations
  duration: 45 minutes
  time: "10:15 - 11:00"
  file: Training/03_Session_3_Branching_and_Sync_Operations.md
  focus: Collaboration workflows
  your_area:
    heading: "Add your .gitignore and share it"
    minutes: 5
    steps:
    - "Copy participants/_template/.gitignore into your folder and add one pattern of your own, for example *.log"
    - "Create notes.csv and check that git status does not list it"
    - "Commit, then push your branch (Codespaces signs you in for you)"
    - "Open a draft pull request into main (do not merge yet)"
    checkpoint: "README.md and .gitignore on your pushed branch, with an open draft pull request"
  slides:
  - title: Branches and the Three-Stage Workflow
    sections:
    - heading: Branches
      bullets:
      - A branch is a safe draft — changes don't affect anyone until merged
      - Short-lived branches for focused pieces of analytics work
    - heading: Working directory → staging area → commit
      bullets:
      - Stage only the files that belong together
      - Commit small, logical changes (atomic commits)
      - Write messages that say what changed and why, linked to an issue
  - title: Remotes — Clone, Fork, Push, Pull and Fetch
    image: sync_flow.png
    image_position: right
    image_alt: "Diagram: clone, fetch, pull and push between your computer and GitHub"
    sections:
    - heading: Getting the code
      bullets:
      - Origin — the default name for the shared repository on GitHub
      - Clone — for team members
      - Fork — for external contributors
    - heading: Keeping in sync
      bullets:
      - Push — send your commits to GitHub
      - Pull — bring in colleagues' changes
      - Fetch — download changes without merging, so you can look first
    note: Your Codespace signs you in to GitHub, so syncing is just pull and push. More on the daily workflow in Session 5.
  - title: ".gitignore — Keeping Data Out"
    sections:
    - heading: Always exclude
      bullets:
      - Patient and sensitive data files
      - Credentials and connection files
      - Query result exports and local databases
      - Notebook checkpoints, Python caches and virtual environments
    - heading: Make it a habit
      bullets:
      - Create .gitignore at the repository root on day one
      - Start from the team template and add project-specific exclusions
    callout: Never commit patient data.
  - title: Pull Requests and Review
    sections:
    - heading: The pull request workflow
      bullets:
      - Create branch → develop → open PR → automated checks → review → address feedback → approve and merge
    - heading: What reviewers check
      bullets:
      - SQL — inclusion and exclusion criteria, date logic, aggregations, performance
      - Python — documented functions, error handling, stated assumptions, reproducible
      - Downstream impact on reports and dashboards
  - title: Conflicts and Rebasing
    image: conflict.png
    image_position: right
    image_alt: "Diagram: two edits to the same line create a conflict, resolved in four steps"
    sections:
    - heading: Why conflicts happen
      bullets:
      - Two people change the same lines of the same file
      - Notebooks conflict easily — JSON, metadata and outputs
    - heading: Resolving safely
      bullets:
      - Pull often to prevent them
      - Edit the conflict markers, test the query, validate the results, then commit
      - Rebase to update your branch with the latest main
  - title: Protected Branches and Branching Strategy
    sections:
    - heading: Protect main
      bullets:
      - Pull request and review required before merging
      - Status checks must pass
      - No direct pushes and no force pushes
    - heading: Keep it simple
      bullets:
      - Simplified Git flow — main plus short-lived feature, bugfix and hotfix branches
      - Smaller pull requests get faster, better reviews
    callout: No data is stored in GitHub — code only.

