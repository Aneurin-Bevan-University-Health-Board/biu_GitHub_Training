      - Explore repositories relevant to your work
    - heading: In the next month
      bullets:
      - Practise the basic workflow regularly
      - Use GitHub for at least one real work project
      - Find a colleague to learn with
  - title: "Optional Extension: SQL on the Academy Dataset"
    optional: true
    sections:
    - heading: For anyone with time, or after the day
      bullets:
      - Needs access to the ndr-hb-abuhb-academy Google Cloud project, which is optional
      - Copy the SQL script into your folder as referrals.sql and run it in BigQuery
      - Preview with SELECT * and LIMIT, name your columns, then try SELECT DISTINCT
    - heading: Why it belongs in Git
      bullets:
      - SQL is code, so changes are tracked, reviewed and reversible
    note: BigQuery needs backticks round a table name with hyphens. Never commit results or data.
