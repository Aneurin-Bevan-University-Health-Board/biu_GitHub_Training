- number: 4
  title: GitHub Cloud Interface
  duration: 30 minutes
  time: "11:00 - 11:30"
  file: Training/04_Session_4_GitHub_Cloud_Interface.md
  focus: Web interface mastery
  your_area:
    heading: "See your work in the browser"
    minutes: 3
    steps:
    - "Open your branch and your folder on github.com"
    - "Find your commits and read the diff"
    - "Use the web editor to add a link to your pull request in your README, committing to your branch"
    checkpoint: "README.md updated from the browser, with a link to your pull request"
  slides:
  - title: Finding Your Way Around a Repository
    image: repo_mock.png
    image_position: right
    image_alt: "Illustration of a repository page with its tabs: Code, Issues, Pull requests, Actions, Projects, Security, Insights"
    sections:
    - heading: The main tabs
      bullets:
      - Code — browse SQL, notebooks and documentation
      - Issues — data requests, bugs and tasks
      - Pull requests — review changes before merging
      - Actions — automated workflows and checks
      - Projects — boards for planning and tracking
      - Insights — contributor and activity statistics
  - title: Commits, Branches and Diffs
    sections:
    - heading: Understanding change
      bullets:
      - Commit history — who changed what, when and why
      - Branches view — see and manage lines of work
      - Diffs — exactly what changed in a file or pull request
      - Blame — who last changed each line
    callout: Check a file's history before changing it.
  - title: Search and Navigation
    sections:
    - heading: Finding things fast
      bullets:
      - Repository search — code, issues, pull requests and commits
      - Global search across GitHub
      - File finder — press t inside a repository
    - heading: Good daily habits
      bullets:
      - Check notifications for reviews and failed runs
      - Review diffs carefully in pull requests
      - Search for similar code before writing something new
  - title: "Exercise: Repository Exploration"
    sections:
    - heading: Steps
      bullets:
      - Clone the training repository and look at recent commits and pull requests
      - Create a branch named feature/yourname-exploration
      - Add a useful document or code snippet, then commit and push
      - Open a pull request and assign reviewers
    note: Tick off each step on the checklist in the Session 4 notes.

# ---------------------------------------------------------------------------------------------------
- number: 5
  title: Codespaces Workspace and File Management
  duration: 30 minutes
  time: "12:15 - 12:45"
  file: Training/05_Session_5_Codespaces_Workspace_and_File_Management.md
  focus: Codespaces as your daily workspace, and large files
  your_area:
    heading: "Add notes from your Codespace"
    minutes: 4
    steps:
    - "Reopen your Codespace on your branch and run git pull to pick up the web edit"
    - "Copy Participant_Pack/04_My_Notes_Template.md into your folder as notes.md and fill in Sessions 1 to 5"
    - "Create data.csv with five made-up rows and check the Source Control view does not list it"
    - "Commit and push"
    checkpoint: "notes.md added; data.csv is ignored and never appears as a change"
  slides:
  - title: Codespaces as Your Daily Workspace
    sections:
    - heading: Why Codespaces first
      bullets:
      - Nothing to install, so it works on locked-down NHS machines
      - Everyone gets the same Python tools and settings
      - Git is already signed in to your account
      - Your work stays on your branch in GitHub
    - heading: A daily rhythm
      bullets:
      - Open your Codespace on your own branch and pull the latest main
      - Make small changes and commit often
      - Push before you finish, then stop the Codespace
    note: Synthetic data only. A Codespace runs outside the Secure Data Environment.
  - title: GitHub Desktop (Optional)
    sections:
    - heading: A visual alternative
      bullets:
      - A point-and-click way to clone, branch, commit and sync
      - Useful if you prefer it or work on a local machine
    - heading: Why we start with Codespaces
      bullets:
      - Fewer installs and sign-in problems on training day
      - The same Git skills apply in both tools
  - title: Large Files and Git LFS
    image: lfs.png
    image_position: right
    image_alt: "Diagram: Git stores a small pointer file while LFS storage holds the large file"
    sections:
    - heading: The problem
      bullets:
      - GitHub recommends repositories under 1 GB, with a 100 MB limit per file
      - Datasets, models and reports quickly exceed this
    - heading: Git LFS
      bullets:
      - Keeps small pointers in Git and the real file on a separate server
      - Use it for reference data and models
    callout: Never commit patient identifiable information — LFS does not change that.
  - title: Daily Workflow and Good Habits
    sections:
    - heading: A good day in a Codespace
      bullets:
      - Pull the latest main at the start of the day
      - Use focused feature branches
      - Commit often with descriptive messages
      - Review the diff in the Source Control view before committing
      - Push at the end of the day, then stop your Codespace
    - heading: Managing files
      bullets:
      - Clear notebook outputs before committing
      - Document data sources and dependencies

# ---------------------------------------------------------------------------------------------------
- number: 6
  title: VS Code Integration and Notebooks
  duration: 30 minutes
  time: "12:45 - 13:15"
  file: Training/06_Session_6_VS_Code_Integration_and_Notebooks.md
  focus: Development environment integration
  your_area:
    heading: "Add a clean notebook"
    minutes: 4
    steps:
    - "Open the repository in VS Code on your branch"
    - "Create starter.ipynb with one cell that prints a greeting, then run it"
    - "Clear all outputs before you commit"
    - "Commit and push from the Source Control panel"
    checkpoint: "starter.ipynb committed with its outputs cleared"
  slides:
  - title: Why VS Code + GitHub
    sections:
    - heading: One window for everything
      bullets:
      - Code, issues and pull requests side by side
      - Integrated terminal and linting
      - Commits and reviews captured alongside the code
      - Easier to enforce team standards
    - heading: Essential extensions
      bullets:
      - GitHub Pull Requests and Issues
      - Python and Jupyter
      - GitHub Copilot, if licensed
  - title: Quick Start Workflow
    sections:
    - heading: From clone to merge
      bullets:
      - Clone the repository and create a feature branch
      - Make small changes, then stage and commit with a message referencing the issue
      - Sync changes (or publish the branch the first time)
      - Open the pull request from the GitHub Pull Requests view
      - Address review comments, merge, then pull the latest main
  - title: Notebook Hygiene and Security Checks
    sections:
    - heading: Notebooks
      bullets:
      - Clear outputs before you commit
      - Keep paths in environment variables, not code
      - Move reusable logic into .py modules
    - heading: Top security checks
      bullets:
      - No identifiable patient data pushed
      - Secrets in environment variables or GitHub secrets — never in code
      - Branch protection with required reviews
      - Keep dependencies updated
  - title: Codespaces vs Local
    sections:
    - heading: Prefer a Codespace when
      bullets:
      - Onboarding new joiners
      - Reviewing with identical tooling
      - You want least-privilege, scoped secrets
    - heading: Prefer local when
      bullets:
      - Working with heavy compute or large datasets
      - The network is unreliable
    note: We try Codespaces hands-on in Session 8.

# ---------------------------------------------------------------------------------------------------
- number: 7
  title: Issues, Projects and Discussions
  duration: 35 minutes
  time: "13:15 - 13:50"
  file: Training/07_Session_7_Issues_Projects_and_Discussions.md
  focus: Project management features
  your_area:
    heading: "Raise an issue and pin your tools"
    minutes: 5
    steps:
    - "Open an issue titled Area: <your-folder> with a checklist of what you have added"
    - "Add requirements.txt listing pandas and matplotlib with the versions you choose"
    - "Link the issue from your pull request by writing Closes #<issue number>"
    - "Open the Security tab and note which alert types are switched on"
    checkpoint: "requirements.txt added; your pull request linked to your issue"
  slides:
  - title: GitHub Issues
    sections:
    - heading: The team's to-do list
      bullets:
      - Track bugs, feature requests, data issues and project tasks
      - Assign owners, add labels and set milestones
      - "Link to code: writing \"closes #12\" in a commit closes the issue on merge"
    - heading: Effective issues
      bullets:
      - Use templates — clinical context, description, acceptance criteria
      - Make the definition of done clear
  - title: The Issue Lifecycle
    image: lifecycle.png
    image_position: bottom
    image_alt: "Flow: issue, branch, commits, pull request, review, merge, issue closed"
    sections:
    - heading: From request to closure
      bullets:
      - Create and triage — categorise and assign
      - Investigate and plan — feasibility, data sources, governance review
      - Develop — feature branch linked to the issue, with review
      - Validate and deploy — stakeholder testing and data quality checks
      - Close — acceptance, documentation and lessons learned
  - title: "GitHub Projects: A Lightweight Board"
    image: kanban.png
    image_position: right
    image_alt: "Illustration of a Kanban board with To do, In progress and Done columns"
    sections:
    - heading: Five-minute setup
      bullets:
      - "Columns: Backlog, In Progress, Review, Blocked, Done"
      - "Fields: priority, target date and owner"
      - Keep labels to about 12 in total
    - heading: Simple automation
      bullets:
      - New labelled issues go to Backlog
      - A merged pull request moves its issue to Done
  - title: GitHub Actions for Automation
    sections:
    - heading: What can be automated
      bullets:
      - Data quality and freshness checks
      - Scheduled monthly or quarterly reports
      - Unit tests for calculations
      - Notifications to Teams or email
    note: Actions are workflow files stored in the repository, so automation is reviewed like any other code.
  - title: "GitHub Advanced Security: What It Is"
    sections:
    - heading: Two products, both for private repositories on paid plans
      bullets:
      - Secret Protection — secret scanning, push protection and custom patterns
      - Code Security — code scanning with CodeQL, Copilot Autofix, dependency review
    - heading: Available on every plan
      bullets:
      - Dependency graph, Dependabot alerts and Dependabot updates
    note: Both products are available to ABUHB private repositories. The GitHub admin team switches them on per repository.
  - title: How Advanced Security Protects Your Work
    image: security_pipeline.png
    image_position: right
    image_alt: "Diagram: security checks when you write, push, open a pull request and after merge"
    sections:
    - heading: At each step
      bullets:
      - Push protection stops a secret before it reaches GitHub
      - Code scanning and dependency review check every pull request
      - Secret scanning and Dependabot keep watching after merge
    - heading: Why it matters to us
      bullets:
      - A pushed secret is exposed, so revoke it first
      - It helps keep credentials and patient data out of code
  - title: Reading and Acting on Security Alerts
    sections:
    - heading: Where to look
      bullets:
      - The Security tab of the repository lists every alert, with severity
      - Pull request checks show new problems before they merge
    - heading: What to do
      bullets:
      - Secret alert — revoke the secret, tell the admin team, then clean up
      - Code alert — read the explanation, fix it, or review a Copilot Autofix suggestion
      - Dependency alert — merge the Dependabot pull request after the tests pass
      - Dismiss only with a reason that a colleague could check
    callout: An alert is a prompt to act, not a verdict. A human decides.

